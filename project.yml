name: CGmail
options:
  bundleIdPrefix: com.cgmail
  deploymentTarget:
    macOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    ENABLE_HARDENED_RUNTIME: YES
    MACOSX_DEPLOYMENT_TARGET: "15.0"

targets:
  CGmail:
    type: application
    platform: macOS
    sources:
      - path: CGmail
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cgmail.app
        INFOPLIST_FILE: CGmail/Info.plist
        CODE_SIGN_ENTITLEMENTS: CGmail/CGmail.entitlements
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - package: GRDB
        product: GRDB
      - package: GoogleSignIn
        product: GoogleSignIn

  CGmailTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: CGmailTests
    dependencies:
      - target: CGmail
    settings:
      base:
        SWIFT_VERSION: "6.0"

packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift
    from: "6.29.0"
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: "7.1.0"
